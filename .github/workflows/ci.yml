name: SWE Inventory CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ruff Lint Check
      run: |
        ruff check .

    - name: Run Automated Tests & Measure Coverage
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ lab04-ai-coding-ux/tests/ -v --cov=src --cov-report=term-missing
